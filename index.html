      {
        id:'prescription', category:'Границы', skill:'Эмпатия + ясная граница', title:'Лекарство без рецепта',

      {

        options:[
          {correct:true,text:'Предложить присесть и спокойно поискать, не торопить. Если рецепт потерян — объяснить, что можно обратиться к врачу за восстановлением.',why:'Спокойный темп и конкретная помощь уменьшают тревогу. Вы поддерживаете самостоятельность человека и объясняете дальнейший шаг, не стыдя его перед очередью.'},

        phrase:'Понимаю, что вы опираетесь на прошлый опыт. Подбирать антибиотик должен врач после оценки состояния. Я могу пояснить порядок отпуска, а назначение нужно обсудить с врачом.'

          {correct:false,text:'Успокоить: «У детей это обычное дело, врач вам точно не нужен».',why:'Такое заверение обесценивает беспокойство и создаёт необоснованную уверенность. По этой сцене нельзя оценить состояние ребёнка или исключить необходимость помощи врача.'}

        phrase:'Я понимаю, что вы волнуетесь. Чтобы не дать неподходящую рекомендацию, мне нужно уточнить возраст, вес и что происходит с ребёнком. Давайте разберёмся спокойно; при необходимости нужна помощь врача.'

        phrase:'Понимаю, как утомительно искать нужный препарат. Давайте проверим, какие сведения о наличии нам доступны и можно ли его заказать. Срок смогу назвать после подтверждения.'

        phrase:'Конечно. Давайте говорить тише. Если вам удобно, можем отойти туда, где меньше слышно. Я уточню только то, что необходимо для вашего вопроса.'
      },
      {
        id:'understanding', category:'Эмпатия', skill:'Проверка понимания без оценки', title:'«Вы непонятно объясняете»',
        scene:'Покупатель несколько раз переспрашивает ваше объяснение. Теперь он сердится. Вы замечаете, что используете много профессиональных терминов.',
        quote:'Я ничего не понял. Можно объяснить по-человечески?',
        options:[
          {correct:true,text:'Признать, что объяснение получилось сложным, повторить простыми словами и попросить пересказать главное, чтобы проверить себя.',why:'Вы берёте ответственность за ясность сообщения. Проверка понимания помогает найти пробелы, если подать её как проверку своего объяснения, а не экзамен для покупателя.'},
          {correct:false,text:'Повторить ту же фразу громче и медленнее, не меняя термины.',why:'Громкость не решает проблему непонятных слов и может прозвучать снисходительно. Лучше изменить формулировку, разбить объяснение на короткие шаги.'},
          {correct:false,text:'Сказать: «Я уже три раза объяснила, прочитайте сами».',why:'Такой ответ обвиняет человека и завершает диалог без понимания. Письменная информация может помочь, но её стоит предложить как поддержку, а не наказание.'}
        ],
        phrase:'Да, я объяснила слишком сложно. Давайте скажу проще, по шагам. А потом попрошу вас повторить главное — чтобы убедиться, что я понятно рассказала.'
      }
    ];

    const paths={arrow:'M4 12h16m-6-6 6 6-6 6',back:'M20 12H4m6-6-6 6 6 6',check:'m5 12 4 4L19 6',close:'m6 6 12 12M18 6 6 18',shuffle:'M3 5h3c5 0 7 14 12 14h3m-4-4 4 4-4 4M3 19h3c2 0 4-3 5-5m2-4c2-3 3-5 5-5h3m-4-4 4 4-4 4',book:'M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1m0-15c3-2 6-2 9-1v15c-3-1-6-1-9 1V5Z',heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z',chat:'M21 11a8 8 0 0 1-8 8H6l-4 3V11a9 9 0 0 1 19 0ZM7 10h10M7 14h6',search:'m21 21-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',leaf:'M20 3C9 2 2 7 5 15s15 5 15-12ZM4 21 16 8',clock:'M12 7v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',repeat:'M20 7H7a5 5 0 0 0 0 10h2m8-13 3 3-3 3M4 17h13a5 5 0 0 0 0-10h-2m-8 7-3 3 3 3'};
    const icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${name==='search'?'<circle cx="10" cy="10" r="7.5"/><path d="m16 16 5 5"/>':`<path d="${paths[name]||paths.chat}"/>`}</svg>`;
    const escapeHTML=(value)=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const byId=id=>CARDS.find(card=>card.id===id);
    const number=id=>String(CARDS.findIndex(c=>c.id===id)+1).padStart(2,'0');
    const shuffle=list=>{const copy=[...list];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;};
    let screen='home',session=null,filter='Все',query='',detailId=null,detailIds=[];
    const main=document.getElementById('main'),cardDialog=document.getElementById('card-dialog'),restartDialog=document.getElementById('restart-dialog');
    const hasActive=()=>session&&session.cursor<session.items.length;
    const score=()=>session.items.filter(item=>item.selected!==null&&byId(item.id).options[item.selected].correct).length;
    function setScreen(next,focus=true){
      screen=next;document.querySelectorAll('.nav button').forEach(button=>{if(button.dataset.action==='train')button.textContent=session&&!hasActive()?'Результат':'Тренировка';const selected=button.dataset.action===(next==='results'?'train':next);button.classList.toggle('active',selected);if(selected)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
      if(next==='home')renderHome();if(next==='train')renderQuestion();if(next==='library')renderLibrary();if(next==='results')renderResults();
      if(focus){window.scrollTo({top:0,behavior:'instant'});const heading=main.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}}
    }
    function renderHome(){
      main.innerHTML=`<div class="screen"><section class="hero"><div><div class="eyebrow">${icon('leaf',15)} Тренажёр бережной коммуникации</div><h1>За рецептом —<br><em>человек.</em></h1><p class="hero-copy">Тревога, спешка, недовольство. За каждой реакцией есть причина. Учитесь слышать покупателя и находить выход из сложных разговоров.</p><div class="actions"><button class="btn primary" data-action="${session&&!hasActive()?'new-session':'train'}">${hasActive()?'Продолжить тренировку':'Начать тренировку'} ${icon('arrow',17)}</button><button class="btn secondary" data-action="library">${icon('book',17)} Все карточки</button></div><p class="hero-footnote">${icon('clock',13)} В своём темпе. Ошибаться здесь — часть обучения.</p></div><div class="visual" aria-label="Пример ситуации: покупатель просит лекарство без рецепта"><div class="back-card"></div><div class="sample-card"><div class="sample-top"><span class="sample-label">${icon('chat',14)} Ситуация в аптеке</span><span class="sample-count">01 / ${CARDS.length}</span></div><blockquote>«Мне всегда продавали<br>без рецепта.<br>Почему вы не можете?»</blockquote><p>Покупатель раздражён.<br>Как сохранить спокойствие и помочь?</p><div class="sample-divider"></div><div class="sample-bottom"><span class="sample-check">${icon('check',14)}</span><span>Сначала услышьте. Затем объясните.</span></div></div><div class="floating-tag">${icon('heart',16)} Эмпатия — тоже профессиональный навык</div></div></section><div class="facts"><div class="fact"><strong>${CARDS.length}</strong><span>ситуаций из повседневной практики</span></div><div class="fact"><strong>3</strong><span>варианта реакции на каждую ситуацию</span></div><div class="fact"><strong>∞</strong><span>попыток, чтобы стать увереннее</span></div></div><section class="how"><div class="section-head"><h2>От ситуации — к пониманию</h2><p>Не заучивайте ответы. Замечайте, что стоит за ними.</p></div><div class="steps"><div class="step"><span class="step-num">01</span><div><h3>Прочитайте ситуацию</h3><p>Представьте себя за первым столом.<br>Что чувствует человек перед вами?</p></div></div><div class="step"><span class="step-num">02</span><div><h3>Выберите реакцию</h3><p>Найдите ответ, который помогает<br>и сохраняет профессиональные границы.</p></div></div><div class="step"><span class="step-num">03</span><div><h3>Разберите решение</h3><p>Узнайте, почему подход работает,<br>и возьмите на заметку готовую фразу.</p></div></div></div></section><aside class="principle-strip"><div class="strip-text"><span class="strip-icon">${icon('leaf',25)}</span><p><b>Спокойствие начинается с паузы.</b><br>Услышать → уточнить → объяснить → предложить следующий шаг.</p></div><button class="text-btn" data-action="library">Посмотреть ситуации ${icon('arrow',16)}</button></aside></div>`;
    }
    function startSession(ids=CARDS.map(c=>c.id),retry=false){session={items:shuffle(ids).map(id=>({id,order:shuffle([0,1,2]),selected:null})),cursor:0,retry};setScreen('train');}
    function renderQuestion(){
      if(!hasActive()){setScreen('results');return;}
      const item=session.items[session.cursor],card=byId(item.id),answered=item.selected!==null,chosen=answered?card.options[item.selected]:null,correctIndex=card.options.findIndex(option=>option.correct);
      const completed=session.items.filter(i=>i.selected!==null).length;
      main.innerHTML=`<div class="training-wrap screen"><div class="page-intro"><div><div class="eyebrow">${icon('shuffle',14)} ${session.retry?'Повтор сложных ситуаций':'Практика общения'}</div><h1>Как вы ответите?</h1><p>Выберите наиболее конструктивную реакцию в этой ситуации.</p></div><button class="text-btn" data-action="restart">${icon('repeat',14)} Заново</button></div><div class="training-meta"><span>Ситуация <strong>${session.cursor+1} из ${session.items.length}</strong></span><span>Верных ответов: <strong>${score()}</strong></span></div><div class="progress-track" role="progressbar" aria-label="Пройдено ситуаций" aria-valuemin="0" aria-valuemax="${session.items.length}" aria-valuenow="${completed}"><div class="progress-fill" style="width:${100*completed/session.items.length}%"></div></div><article class="question-panel"><div class="card-meta"><span class="pill">${icon('chat',13)} ${escapeHTML(card.category)}</span><span class="id">КАРТОЧКА ${number(card.id)}</span></div><h2>${escapeHTML(card.title)}</h2><p class="scene">${escapeHTML(card.scene)}</p><blockquote class="client-quote"><small>Покупатель</small>«${escapeHTML(card.quote)}»</blockquote></article><div class="answer-heading"><h3>Ваша реакция</h3><span>Можно выбрать клавишами 1, 2, 3</span></div><div class="answers" role="group" aria-label="Варианты ответа">${item.order.map((optionIndex,index)=>{const option=card.options[optionIndex],isSelected=optionIndex===item.selected;let status='';if(answered){if(option.correct)status=isSelected?'Верный ответ · ваш выбор':'Верный ответ';else if(isSelected)status='Неверный ответ · ваш выбор';}return `<button class="answer ${answered?(option.correct?'good':isSelected?'bad':'faded'):''}" data-answer="${optionIndex}" ${answered?'disabled':''}><span class="answer-key">${answered&&(option.correct||isSelected)?icon(option.correct?'check':'close',14):index+1}</span><span class="answer-text">${escapeHTML(option.text)}${status?`<span class="answer-status">${status}</span>`:''}</span></button>`;}).join('')}</div>${answered?`<section class="feedback ${chosen.correct?'':'incorrect'}" aria-labelledby="feedback-title"><h2 id="feedback-title" class="feedback-title" tabindex="-1">${icon(chosen.correct?'check':'close',20)} ${chosen.correct?'Верно. Вы помогаете диалогу.':'Неверно. Давайте разберёмся.'}</h2><p>${escapeHTML(chosen.why)}</p>${!chosen.correct?`<p><b>Почему работает верный ответ:</b> ${escapeHTML(card.options[correctIndex].why)}</p>`:''}<div class="suggested"><strong>Можно сказать так</strong><blockquote>«${escapeHTML(card.phrase)}»</blockquote></div><div class="feedback-bottom"><span class="technique">${icon('leaf',15)} ${escapeHTML(card.skill)}</span><button class="btn primary" data-action="next">${session.cursor===session.items.length-1?'Посмотреть результат':'Следующая ситуация'} ${icon('arrow',16)}</button></div></section>`:''}<div class="train-bottom"><button class="text-btn" data-action="home">${icon('back',14)} На главную</button><span class="quiet-note">${icon('heart',13)} ${answered?'Не идеальная фраза, а уважение и понятный следующий шаг.':'Не спешите. Здесь нет таймера.'}</span></div></div>`;
    }
    function answer(index){if(screen!=='train'||!hasActive())return;const item=session.items[session.cursor];if(item.selected!==null||!Number.isInteger(index)||index<0||index>2)return;item.selected=index;renderQuestion();document.getElementById('feedback-title').focus({preventScroll:true});document.querySelector('.feedback').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});}
    function visibleCards(){const q=query.toLocaleLowerCase('ru').trim();return CARDS.filter(card=>(filter==='Все'||card.category===filter)&&(!q||[card.title,card.scene,card.quote,card.category,card.skill].join(' ').toLocaleLowerCase('ru').includes(q)));}
    function renderLibrary(){main.innerHTML=`<div class="screen"><div class="page-intro"><div><div class="eyebrow">${icon('book',14)} Коллекция ситуаций</div><h1>Каждый разговор важен.</h1><p>Откройте карточку: внутри ситуация, варианты реакции и объяснение каждого ответа.</p></div><button class="btn primary" data-action="${session&&!hasActive()?'new-session':'train'}">${hasActive()?'Продолжить тренировку':'Тренироваться'} ${icon('arrow',16)}</button></div><div class="library-tools"><div class="filters" role="group" aria-label="Категория ситуаций">${['Все','Эмпатия','Границы','Сервис'].map(name=>`<button class="filter ${filter===name?'active':''}" aria-pressed="${filter===name}" data-filter="${name}">${name}</button>`).join('')}</div><label class="search-wrap">${icon('search',16)}<span class="sr-only">Найти ситуацию</span><input id="search" type="search" placeholder="Найти ситуацию…" value="${escapeHTML(query)}" autocomplete="off"></label></div><p id="library-count" class="library-count" role="status" aria-live="polite"></p><div id="card-grid" class="card-grid"></div></div>`;renderGrid();}
    function renderGrid(){const cards=visibleCards();document.getElementById('library-count').textContent=`Показано: ${cards.length} из ${CARDS.length}`;document.getElementById('card-grid').innerHTML=cards.length?cards.map(card=>`<button class="study-card" data-card="${card.id}" aria-haspopup="dialog"><div class="card-meta"><span class="pill">${escapeHTML(card.category)}</span><span class="id">${number(card.id)}</span></div><h2>${escapeHTML(card.title)}</h2><p>«${escapeHTML(card.quote)}»</p><span class="open-label">Ситуация и разбор ${icon('arrow',15)}</span></button>`).join(''):'<div class="no-results">Ничего не нашлось. Попробуйте другое слово или категорию.</div>';}
    function openCard(id,navigate=false){detailId=id;if(!navigate){detailIds=screen==='library'?visibleCards().map(c=>c.id):screen==='results'?session.items.map(i=>i.id):CARDS.map(c=>c.id);}const card=byId(id),position=detailIds.indexOf(id);cardDialog.innerHTML=`<div class="dialog-top"><p>Карточка ${number(id)} · ${position+1} из ${detailIds.length}</p><button class="icon-btn" data-action="close-card" aria-label="Закрыть карточку">${icon('close',17)}</button></div><div class="dialog-body"><span class="pill">${escapeHTML(card.category)}</span><h2 id="detail-title" tabindex="-1">${escapeHTML(card.title)}</h2><p class="scene">${escapeHTML(card.scene)}</p><blockquote class="client-quote">«${escapeHTML(card.quote)}»</blockquote><h3 class="review-label">Реакции и их последствия</h3>${card.options.map(option=>`<section class="review-option ${option.correct?'correct':''}"><header>${icon(option.correct?'check':'close',14)} ${option.correct?'ВЕРНО · КОНСТРУКТИВНАЯ РЕАКЦИЯ':'НЕВЕРНО · УСИЛИВАЕТ ПРОБЛЕМУ'}</header><p>${escapeHTML(option.text)}</p><p class="reason">${escapeHTML(option.why)}</p></section>`).join('')}<div class="suggested"><strong>Можно сказать так</strong><blockquote>«${escapeHTML(card.phrase)}»</blockquote></div><div class="dialog-nav"><button class="btn secondary" data-action="previous-card" ${position===0?'disabled':''}>${icon('back',14)} Назад</button><button class="btn secondary" data-action="next-card" ${position===detailIds.length-1?'disabled':''}>Следующая ${icon('arrow',14)}</button></div></div>`;if(!cardDialog.open)cardDialog.showModal();cardDialog.scrollTop=0;document.getElementById('detail-title').focus({preventScroll:true});}
    function renderResults(){
      if(!session){setScreen('home');return;}const total=session.items.length,correct=score(),missed=total-correct;const headline=missed===0?'Спокойствие — ваша сильная сторона.':correct/total>=.6?'Хорошая основа для диалога.':'Каждый разбор — шаг к уверенности.';
      main.innerHTML=`<div class="results screen"><div class="page-intro"><div><div class="eyebrow">${icon('leaf',14)} ${session.retry?'Повтор завершён':'Тренировка завершена'}</div><h1>Опыт, который остаётся.</h1><p>Это повод заметить удачные решения и разобраться в сложных моментах.</p></div></div><section class="result-card"><div class="result-ring" style="--score:${correct/total*100}%" role="img" aria-label="Верных ответов ${correct} из ${total}"><div class="ring-content"><b>${correct}<span class="sr-only"> из </span><span aria-hidden="true" style="font-size:23px;color:#a2bda6"> / ${total}</span></b><span>верных ответов</span></div></div><div class="result-copy"><div class="eyebrow">Практика имеет значение</div><h2>${headline}</h2><p>${missed===0?'Вы выбрали конструктивную реакцию в каждой ситуации. Попробуйте теперь сформулировать ответы своими словами: так принципы легче перенести в настоящий разговор.':'В реальном разговоре важны не только слова, но и тон, паузы, готовность услышать. Вернитесь к сложным ситуациям и подумайте, что помогло бы человеку почувствовать себя услышанным.'}</p></div></section><div class="actions">${missed?`<button class="btn primary" data-action="retry">${icon('repeat',16)} Повторить ошибки (${missed})</button>`:''}<button class="btn ${missed?'secondary':'primary'}" data-action="new-session">${icon('shuffle',16)} Все ${CARDS.length} ситуаций заново</button><button class="btn secondary" data-action="library">${icon('book',16)} Все карточки</button></div>${!missed?'<div class="all-good"><b>Возьмите с собой четыре шага:</b><br>Услышать эмоцию → уточнить обстоятельства → спокойно объяснить границу → предложить реальный следующий шаг.</div>':''}<div class="result-subtitle"><h2>Ваши решения</h2><p>Нажмите на ситуацию, чтобы открыть полный разбор.</p></div><div class="result-list">${session.items.map(item=>{const card=byId(item.id),ok=card.options[item.selected].correct;return `<button class="result-row" data-card="${card.id}" aria-haspopup="dialog"><span class="status-icon ${ok?'':'wrong'}">${icon(ok?'check':'close',17)}</span><span class="row-title">${escapeHTML(card.title)}</span><span class="row-status ${ok?'':'wrong'}">${ok?'Верно':'Стоит повторить'}</span>${icon('arrow',15)}</button>`;}).join('')}</div></div>`;
    }
    document.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||button.disabled)return;
      if(button.dataset.answer!==undefined){answer(Number(button.dataset.answer));return;}
      if(button.dataset.card){openCard(button.dataset.card);return;}
      if(button.dataset.filter){filter=button.dataset.filter;document.querySelectorAll('.filter').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter));});renderGrid();return;}
      switch(button.dataset.action){
        case 'home':setScreen('home');break;
        case 'library':setScreen('library');break;
        case 'train':if(hasActive())setScreen('train');else if(session)setScreen('results');else startSession();break;
        case 'new-session':startSession();break;
        case 'restart':restartDialog.showModal();break;
        case 'cancel-restart':restartDialog.close();break;
        case 'confirm-restart':{const ids=session.items.map(item=>item.id),retry=session.retry;restartDialog.close();startSession(ids,retry);break;}
        case 'next':if(!hasActive()||session.items[session.cursor].selected===null)return;session.cursor++;setScreen(hasActive()?'train':'results');break;
        case 'retry':startSession(session.items.filter(item=>!byId(item.id).options[item.selected].correct).map(item=>item.id),true);break;
        case 'close-card':cardDialog.close();break;
        case 'previous-card':{const i=detailIds.indexOf(detailId);if(i>0)openCard(detailIds[i-1],true);break;}
        case 'next-card':{const i=detailIds.indexOf(detailId);if(i<detailIds.length-1)openCard(detailIds[i+1],true);break;}
      }
    });
    document.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;renderGrid();}});
    document.addEventListener('keydown',event=>{if(event.repeat||event.altKey||event.metaKey||event.ctrlKey||event.shiftKey||cardDialog.open||restartDialog.open||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;if(screen==='train'&&hasActive()&&['1','2','3'].includes(event.key)){event.preventDefault();answer(session.items[session.cursor].order[Number(event.key)-1]);}});
    // Закрытие по фону не срабатывает при обычном клике или выделении текста внутри карточки.
    for(const dialog of [cardDialog,restartDialog]){let startedOutside=false;dialog.addEventListener('pointerdown',event=>{const r=dialog.getBoundingClientRect();startedOutside=event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom;});dialog.addEventListener('click',event=>{const r=dialog.getBoundingClientRect();if(startedOutside&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom))dialog.close();startedOutside=false;});dialog.addEventListener('close',()=>document.body.style.overflow='');}
    const modalObserver=new MutationObserver(()=>{document.body.style.overflow=cardDialog.open||restartDialog.open?'hidden':'';});for(const dialog of [cardDialog,restartDialog])modalObserver.observe(dialog,{attributes:true,attributeFilter:['open']});
    setScreen('home',false);
  </script>
</body>
</html>
